# ─────────────────────────────────────────────────────────────────────────────
#  maylog · conteúdo do site
#
#  Tudo o que aparece no site e não vem dos posts fica aqui: dá para editar
#  sem mexer em código.
#
#  · Com o "npm run dev" rodando, salve o arquivo e a página atualiza sozinha.
#  · No site publicado, a mudança aparece no próximo build (depois do git push).
#
#  Regrinhas do formato (YAML):
#  · O recuo importa: use 2 espaços (não use Tab).
#  · Itens de lista começam com "- ".
#  · Textos que começam com @ ou têm ":" no meio vão entre aspas: "@maykeesa".
#  · Campos terminados em "_en" são a versão em inglês; se faltar, usa o português.
# ─────────────────────────────────────────────────────────────────────────────


# Dados gerais
site:
  nome: maylog
  autor: Mayke Erick
  url: https://maylog.com.br # domínio de exemplo: troque pelo seu quando tiver
  frase: registros sobre o que der vontade de escrever.
  frase_en: notes on whatever feels worth writing.


# Bloco "agora" da página inicial
agora:
  atualizado: "2026-11-14" # aparece no canto da barra (dia.mês)
  itens:
